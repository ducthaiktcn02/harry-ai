<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Harry AI</title>
<meta name="theme-color" content="#1a73e8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Harry AI">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Roboto,"Segoe UI",Arial,sans-serif;background:#fff;color:#202124;font-size:14px;overflow:hidden}
button{font-family:inherit;cursor:pointer}
[hidden]{display:none!important}
.muted{color:#5f6368;font-size:12px}
.spacer{flex:1}
/* Đăng nhập */
#man-vao{position:fixed;inset:0;background:#f8f9fa;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.box-vao{background:#fff;padding:36px 28px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.2);width:320px;max-width:100%}
.logo{font-size:28px;font-weight:500;color:#1a73e8;margin-bottom:6px}
.btn-google{margin-top:22px;border:1px solid #dadce0;background:#fff;border-radius:20px;padding:10px 20px;font-size:14px}
.btn-google:hover{background:#f1f3f4}
#tb-vao{margin-top:14px;font-size:13px;color:#5f6368}
#tb-vao.loi{color:#d93025}
/* Khung */
#app{display:flex;flex-direction:column;height:100%}
header{height:56px;border-bottom:1px solid #dadce0;display:flex;align-items:center;padding:0 8px;gap:4px;flex-shrink:0}
.icon-btn{border:none;background:none;width:40px;height:40px;border-radius:50%;font-size:20px;color:#5f6368}
.icon-btn:hover{background:#f1f3f4}
.brand{font-size:20px;color:#5f6368;margin:0 12px 0 6px;white-space:nowrap}
.brand b{color:#1a73e8;font-weight:500}
.btn-out{border:1px solid #dadce0;background:#fff;border-radius:4px;padding:7px 12px;font-size:14px}
.btn-out:hover{background:#f1f3f4}
#tieude{font-size:18px;margin-left:6px;white-space:nowrap}
select{border:1px solid #dadce0;border-radius:4px;padding:7px 8px;font-size:14px;background:#fff;font-family:inherit}
.body{flex:1;display:flex;min-height:0}
aside{width:220px;padding:12px;border-right:1px solid #f1f3f4;overflow:auto;flex-shrink:0}
.btn-tao{border:none;background:#fff;box-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px rgba(60,64,67,.15);border-radius:16px;padding:12px 20px;font-size:14px;display:flex;align-items:center;gap:10px;margin-bottom:16px}
.btn-tao span{font-size:24px;color:#1a73e8;line-height:14px}
.nav a{display:block;padding:9px 12px;border-radius:0 20px 20px 0;margin-left:-12px;color:#202124;cursor:pointer}
.nav a.on{background:#e8f0fe;color:#1967d2;font-weight:500}
.nav a:hover:not(.on){background:#f1f3f4}
.side-h{font-size:13px;font-weight:500;margin:18px 0 6px}
.cat{display:flex;align-items:center;gap:8px;padding:4px 0}
.dot{width:12px;height:12px;border-radius:3px;display:inline-block;flex-shrink:0}
main{flex:1;overflow:auto;position:relative;min-width:0}
.page{display:none}.page.on{display:block}
#p-lich.on{height:100%;display:flex;flex-direction:column}
/* Lịch tuần/ngày */
.cal-wrap{flex:1;overflow:auto;position:relative}
.dau{display:flex;border-bottom:1px solid #dadce0;position:sticky;top:0;background:#fff;z-index:4}
.gut{width:48px;flex-shrink:0}
.ngay-h{flex:1;text-align:center;padding:6px 0;font-size:11px;color:#70757a;border-left:1px solid #dadce0;min-width:0}
.ngay-h .so{font-size:22px;color:#3c4043;width:40px;height:40px;line-height:40px;border-radius:50%;margin:2px auto 0}
.ngay-h.nay{color:#1a73e8}.ngay-h.nay .so{background:#1a73e8;color:#fff}
.ca-ngay-row{display:flex;border-bottom:1px solid #dadce0;position:sticky;top:0;background:#fff;z-index:3}
.ca-ngay-cell{flex:1;border-left:1px solid #dadce0;padding:2px;min-height:22px;min-width:0}
.thon{display:flex;position:relative}
.gio div{height:48px;font-size:10px;color:#70757a;text-align:right;padding-right:6px;transform:translateY(-6px)}
.cot{flex:1;border-left:1px solid #dadce0;position:relative;min-width:0;height:1152px;background:repeating-linear-gradient(#fff 0 47px,#e8eaed 47px 48px)}
.ev{position:absolute;border-radius:4px;color:#fff;font-size:12px;padding:2px 5px;overflow:hidden;cursor:pointer;box-shadow:0 0 0 1px #fff;z-index:2;line-height:1.25}
.ev small{display:block;opacity:.92;font-size:11px}
.ev-ngay{color:#fff;border-radius:3px;padding:1px 5px;margin-bottom:2px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.bay-gio{position:absolute;left:0;right:0;height:2px;background:#ea4335;z-index:3;pointer-events:none}
.bay-gio:before{content:"";position:absolute;left:-5px;top:-5px;width:12px;height:12px;border-radius:50%;background:#ea4335}
/* Tháng */
.thang-h{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid #dadce0}
.thang-h div{text-align:center;font-size:11px;color:#70757a;padding:6px 0}
.thang{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(92px,1fr);flex:1}
.o{border-right:1px solid #dadce0;border-bottom:1px solid #dadce0;padding:3px;overflow:hidden;cursor:pointer;min-width:0}
.o .d{text-align:center;font-size:12px;margin-bottom:2px}
.o.khac .d{color:#9aa0a6}
.o.nay .d span{background:#1a73e8;color:#fff;border-radius:50%;padding:3px 7px}
.them{font-size:11px;color:#5f6368;padding-left:4px}
/* Cài đặt */
.pad{padding:20px 24px;max-width:640px}
.pad h2{font-size:22px;font-weight:400;margin-bottom:14px}
.hop{border:1px solid #dadce0;border-radius:8px;padding:14px 16px;margin-bottom:14px}
.hop h3{font-size:15px;font-weight:500;margin-bottom:8px}
.dong-loai{display:flex;align-items:center;gap:10px;padding:6px 0}
.dong-loai input[type=color]{width:32px;height:28px;border:none;background:none;padding:0}
.dong-loai input[type=text]{flex:1;border:1px solid #dadce0;border-radius:4px;padding:6px 8px;font-size:14px}
/* Hộp thoại */
.overlay{position:fixed;inset:0;background:rgba(32,33,36,.4);display:none;align-items:center;justify-content:center;z-index:30}
.overlay.on{display:flex}
.dialog{background:#fff;border-radius:8px;width:440px;max-width:calc(100vw - 20px);padding:20px 22px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-height:92vh;overflow:auto}
.dialog h3{font-size:18px;font-weight:400;margin-bottom:12px}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;color:#5f6368;margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid #dadce0;border-radius:4px;padding:8px 10px;font-size:15px;font-family:inherit}
.f input.lon{border:none;border-bottom:1px solid #dadce0;border-radius:0;font-size:20px;padding:6px 0}
.f input[type=checkbox]{width:auto;margin-right:6px}
.hang{display:flex;gap:10px}.hang .f{flex:1}
.hanh-dong{display:flex;gap:8px;margin-top:8px;align-items:center}
.btn-xanh{background:#1a73e8;color:#fff;border:none;border-radius:4px;padding:9px 18px;font-size:14px}
.btn-xanh:hover{background:#1765cc}
.btn-chu{background:none;border:none;color:#1a73e8;padding:9px 12px;font-size:14px;border-radius:4px}
.btn-chu:hover{background:#f1f3f4}
.btn-do{color:#d93025}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#323232;color:#fff;padding:12px 18px;border-radius:4px;display:none;z-index:40;max-width:90vw}
.ev.keo{opacity:.85;z-index:9;box-shadow:0 4px 12px rgba(0,0,0,.4);cursor:grabbing}
.ev{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chon-pham label{display:block;padding:9px 4px;font-size:15px;cursor:pointer}
.chon-pham input{margin-right:8px}
.dong-rac{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f1f3f4}
.dong-rac .nd{flex:1;min-width:0}
.dong-rac .nd b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fab{display:none}
@media(max-width:760px){
 aside{display:none}
 .brand{display:none}
 #tieude{font-size:15px}
 .fab{display:block;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:16px;border:none;background:#c2e7ff;font-size:28px;color:#1a73e8;box-shadow:0 2px 6px rgba(0,0,0,.3);z-index:20}
 .btn-out{padding:7px 8px}
 .icon-btn{width:34px}
 .ngay-h .so{font-size:16px;width:30px;height:30px;line-height:30px}
 .gut{width:36px}
 .ev{font-size:10px;padding:1px 3px}
 .pad{padding:14px}
}
</style>
</head>
<body>

<div id="man-vao" hidden>
  <div class="box-vao">
    <div class="logo">Harry AI</div>
    <div class="muted">Trợ lý cá nhân: lịch, ý tưởng, bản tin sáng</div>
    <button class="btn-google" id="btnVao"><b style="color:#4285f4">G</b> Đăng nhập bằng Google</button>
    <div id="tb-vao">Đang kiểm tra đăng nhập…</div>
    <button class="btn-chu" id="btnRaLoi" hidden style="margin-top:10px">Đăng xuất</button>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="brand"><b>Harry</b> AI</div>
    <button class="btn-out" id="btnNay">Hôm nay</button>
    <button class="icon-btn" id="btnTruoc" aria-label="Trước">‹</button>
    <button class="icon-btn" id="btnSau" aria-label="Sau">›</button>
    <div id="tieude"></div>
    <div class="spacer"></div>
    <select id="chonKieu">
      <option value="day">Ngày</option>
      <option value="week">Tuần</option>
      <option value="month">Tháng</option>
    </select>
    <button class="icon-btn" id="btnCai" title="Cài đặt">⚙</button>
  </header>
  <div class="body">
    <aside>
      <button class="btn-tao" id="btnTao"><span>+</span> Tạo</button>
      <nav class="nav">
        <a data-p="lich" class="on">📅 Lịch</a>
        <a data-p="rac">🗑 Thùng rác</a>
        <a data-p="cai">⚙ Cài đặt</a>
      </nav>
      <div class="side-h">Loại việc</div>
      <div id="dsLoai"></div>
    </aside>
    <main>
      <section class="page on" id="p-lich"><div id="lich" class="cal-wrap" style="display:flex;flex-direction:column"></div></section>
      <section class="page" id="p-rac"><div class="pad">
        <h2>Thùng rác</h2>
        <div class="muted" style="margin-bottom:8px">Sự kiện đã xoá được giữ 30 ngày, sau đó tự xoá hẳn.</div>
        <div id="dsRac"></div>
      </div></section>
      <section class="page" id="p-cai"><div class="pad">
        <h2>Cài đặt</h2>
        <div class="hop"><h3>Loại việc (tên + màu)</h3><div id="sua-loai"></div></div>
        <div class="hop"><h3>Thùng rác</h3><button class="btn-out" id="btnRac">🗑 Mở thùng rác</button></div>
        <div class="hop"><h3>Tài khoản</h3>
          <div class="muted" id="email" style="margin-bottom:10px"></div>
          <button class="btn-out" id="btnRa">Đăng xuất</button></div>
      </div></section>
    </main>
  </div>
  <button class="fab" id="fab" aria-label="Tạo sự kiện">+</button>
</div>

<div class="overlay" id="ov"><div class="dialog" id="dlg"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
const C = window.HARRY_CONFIG;
const sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_PUBLISHABLE_KEY);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n) => String(n).padStart(2, '0');
const H = 48; // px mỗi giờ
const THU = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];

/* ---------- Ngày giờ ---------- */
const sod = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hm = (d) => pad(d.getHours()) + ':' + pad(d.getMinutes());
const sameDay = (a, b) => ymd(a) === ymd(b);
const monday = (d) => { const x = sod(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const parseLocal = (dateStr, timeStr) => new Date(dateStr + 'T' + (timeStr || '00:00'));

/* ---------- Trạng thái ---------- */
let view = localStorage.getItem('kieu') || (innerWidth < 760 ? 'day' : 'week');
let cur = new Date();
let EV = [], RAW = [], CATS = [];
let user = null;
const cat = (id) => CATS.find((c) => c.id === id) || CATS[0] || { ten: '?', mau: '#1a73e8' };

function toast(t) { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => (e.style.display = 'none'), 3500); }

/* ---------- Đăng nhập + kiểm tra chủ app ---------- */
function tbVao(t, loi) { $('tb-vao').textContent = t; $('tb-vao').className = loi ? 'loi' : ''; }

async function kiemTraChu(u) {
  const r = await sb.from('app_owner').select('user_id');
  if (r.error) throw r.error;
  if (r.data.length) return r.data.some((x) => x.user_id === u.id);
  const ins = await sb.from('app_owner').insert({ user_id: u.id });
  return !ins.error;
}

let dangVao = false;
async function capNhat() {
  const { data } = await sb.auth.getSession();
  const u = data.session && data.session.user;
  if (!u) { user = null; $('app').hidden = true; $('man-vao').hidden = false; $('btnVao').hidden = false; $('btnRaLoi').hidden = true; tbVao(''); return; }
  if (user && user.id === u.id) return; // đã vào rồi
  if (dangVao) return; dangVao = true;
  try {
    $('man-vao').hidden = false; $('btnVao').hidden = true; tbVao('Đang kiểm tra…');
    if (await kiemTraChu(u)) {
      user = u; $('email').textContent = u.email;
      $('man-vao').hidden = true; $('app').hidden = false;
      await batDau();
    } else {
      $('btnRaLoi').hidden = false;
      tbVao('Tài khoản này không phải chủ app nên không xem được dữ liệu.', true);
    }
  } catch (e) {
    $('btnRaLoi').hidden = false;
    tbVao('Lỗi: ' + (e.message || e) + ' (đã chạy file SQL chưa?)', true);
  } finally { dangVao = false; }
}
$('btnVao').onclick = () => sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
const dangXuat = async () => { await sb.auth.signOut(); user = null; capNhat(); };
$('btnRa').onclick = dangXuat; $('btnRaLoi').onclick = dangXuat;
sb.auth.onAuthStateChange((ev) => { if (ev !== 'TOKEN_REFRESHED') setTimeout(capNhat, 0); });

/* ---------- Dữ liệu ---------- */
let daDangKy = false;
async function batDau() {
  await donRac();
  await Promise.all([taiLoai(), taiSuKien()]);
  veTatCa();
  if (!daDangKy) {
    daDangKy = true;
    sb.channel('lich-dong-bo')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'su_kien' }, async () => { await taiSuKien(); veLich(); if ($('p-rac').classList.contains('on')) veRac(); })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'loai_viec' }, async () => { await taiLoai(); veTatCa(); })
      .subscribe();
    document.addEventListener('visibilitychange', async () => { if (!document.hidden && user) { await taiSuKien(); veLich(); } });
  }
}
async function taiLoai() {
  const r = await sb.from('loai_viec').select('*').order('thu_tu');
  if (r.error) return toast('Lỗi tải loại việc: ' + r.error.message);
  CATS = r.data;
}
async function taiSuKien() {
  const r = await sb.from('su_kien').select('*').is('xoa_luc', null).order('bat_dau');
  if (r.error) return toast('Lỗi tải lịch: ' + r.error.message);
  RAW = r.data;
}
const LAP_TEN = { none: 'Không lặp', day: 'Hằng ngày', week: 'Hằng tuần', month: 'Hằng tháng' };
/* Bung sự kiện lặp thành từng lần trong khoảng [from, to) */
function bung(from, to) {
  const out = [];
  RAW.forEach((r) => {
    const s = new Date(r.bat_dau), e = new Date(r.ket_thuc), dur = e - s;
    const mk = (os) => ({ ...r, s: os, e: new Date(os.getTime() + dur), occ: os, base: r, key: r.lap === 'none' ? r.id : r.id + '@' + os.getTime() });
    if (r.lap === 'none' || !r.lap) { if (s < to && e > from) out.push(mk(s)); return; }
    const ngoai = (r.lap_ngoai || []).map((x) => new Date(x).getTime());
    const den = r.lap_den || null;
    let k = 0;
    if (r.lap === 'month') k = Math.max(0, (from.getFullYear() - s.getFullYear()) * 12 + from.getMonth() - s.getMonth() - 2);
    else k = Math.max(0, Math.floor((from - dur - s) / (86400000 * (r.lap === 'week' ? 7 : 1))) - 1);
    for (let n = 0; n < 4000; n++, k++) {
      const os = new Date(s);
      if (r.lap === 'month') { os.setMonth(s.getMonth() + k); if (os.getDate() !== s.getDate()) continue; }
      else os.setDate(s.getDate() + k * (r.lap === 'week' ? 7 : 1));
      if (os >= to) break;
      if (den && ymd(os) > den) break;
      if (os.getTime() + dur <= from || ngoai.includes(os.getTime())) continue;
      out.push(mk(os));
    }
  });
  return out;
}

/* ---------- Vẽ lịch ---------- */
function veTatCa() { veLoai(); veLich(); veCai(); }
function veLoai() {
  $('dsLoai').innerHTML = CATS.map((c) => `<div class="cat"><span class="dot" style="background:${esc(c.mau)}"></span>${esc(c.ten)}</div>`).join('');
}
const dauLap = (e) => (e.lap && e.lap !== 'none' ? '↻ ' : '');
const evTrongNgay = (d) => {
  const a = sod(d), b = addDays(a, 1);
  return EV.filter((e) => e.s < b && e.e > a);
};

function veLich() {
  if (!user) return;
  $('chonKieu').value = view;
  {
    const a = view === 'month' ? monday(new Date(cur.getFullYear(), cur.getMonth(), 1)) : view === 'day' ? sod(cur) : monday(cur);
    EV = bung(a, addDays(a, view === 'month' ? 42 : view === 'day' ? 1 : 7));
  }
  if (view === 'month') return veThang();
  const days = view === 'day' ? [sod(cur)] : Array.from({ length: 7 }, (_, i) => addDays(monday(cur), i));
  const t0 = days[0], t1 = days[days.length - 1];
  $('tieude').textContent = view === 'day'
    ? `${THU[t0.getDay()]}, ${t0.getDate()} tháng ${t0.getMonth() + 1}, ${t0.getFullYear()}`
    : `Tháng ${t1.getMonth() + 1}, ${t1.getFullYear()}`;
  const today = new Date();
  let h = '<div class="dau"><div class="gut"></div>' + days.map((d) =>
    `<div class="ngay-h ${sameDay(d, today) ? 'nay' : ''}">${THU[d.getDay()]}<div class="so">${d.getDate()}</div></div>`).join('') + '</div>';
  // Hàng cả ngày
  const cn = days.map((d) => evTrongNgay(d).filter((e) => e.ca_ngay));
  if (cn.some((a) => a.length)) {
    h += '<div class="ca-ngay-row" style="position:static"><div class="gut"></div>' + cn.map((a) =>
      `<div class="ca-ngay-cell">${a.map((e) => `<div class="ev-ngay" data-id="${e.key}" style="background:${esc(cat(e.loai).mau)}">${dauLap(e)}${esc(e.tieu_de)}</div>`).join('')}</div>`).join('') + '</div>';
  }
  h += '<div class="thon"><div class="gut gio">' + Array.from({ length: 24 }, (_, i) => `<div>${i ? pad(i) + ':00' : ''}</div>`).join('') + '</div>';
  days.forEach((d, i) => {
    h += `<div class="cot" data-ngay="${ymd(d)}">${khoiSuKien(d)}${sameDay(d, today) ? `<div class="bay-gio" style="top:${(today.getHours() + today.getMinutes() / 60) * H}px"></div>` : ''}</div>`;
  });
  h += '</div>';
  const el = $('lich'); const giu = el.scrollTop;
  el.className = 'cal-wrap'; el.style.display = 'block';
  el.innerHTML = h;
  el.scrollTop = veLich.lanDau ? giu : (veLich.lanDau = true, Math.max(0, (Math.min(today.getHours(), 18) - 1) * H));
  el.querySelectorAll('.ev').forEach((n) => keoTha(n, EV.find((x) => x.key === n.dataset.id)));
  el.querySelectorAll('.cot').forEach((c) => c.onclick = (ev) => {
    if (ev.target.closest('.ev') || Date.now() - vuaKeo < 500) return;
    const y = ev.clientY - c.getBoundingClientRect().top;
    const phut = Math.floor((y / H) * 2) * 30;
    moHopThoai(null, { ngay: c.dataset.ngay, gio: pad(Math.floor(phut / 60)) + ':' + pad(phut % 60) });
  });
  el.querySelectorAll('[data-id]').forEach((n) => n.onclick = (ev) => { ev.stopPropagation(); if (Date.now() - vuaKeo < 500) return; moHopThoai(EV.find((x) => x.key === n.dataset.id)); });
}

function khoiSuKien(d) {
  const a = sod(d), b = addDays(a, 1);
  const list = EV.filter((e) => !e.ca_ngay && e.s < b && e.e > a).map((e) => {
    const s = e.s < a ? a : e.s, en = e.e > b ? b : e.e;
    const top = ((s - a) / 3600000) * H;
    const hgt = Math.max(((en - s) / 3600000) * H, 20);
    return { e, s, en, top, bot: top + hgt, hgt };
  }).sort((x, y) => x.top - y.top || y.bot - x.bot);
  // xếp làn khi trùng giờ
  let cluster = [], maxBot = -1;
  const done = [];
  const flush = () => {
    const lanes = [];
    cluster.forEach((it) => {
      let l = lanes.findIndex((end) => end <= it.top);
      if (l < 0) { l = lanes.length; lanes.push(0); }
      lanes[l] = it.bot; it.lane = l;
    });
    cluster.forEach((it) => { it.n = lanes.length; done.push(it); });
    cluster = []; maxBot = -1;
  };
  list.forEach((it) => { if (cluster.length && it.top >= maxBot) flush(); cluster.push(it); maxBot = Math.max(maxBot, it.bot); });
  if (cluster.length) flush();
  return done.map((it) => {
    const w = 100 / it.n;
    return `<div class="ev" data-id="${it.e.key}" style="top:${it.top}px;height:${it.hgt}px;left:calc(${it.lane * w}% + 1px);width:calc(${w}% - 4px);background:${esc(cat(it.e.loai).mau)}">${dauLap(it.e)}${esc(it.e.tieu_de)}<small>${hm(it.e.s)} – ${hm(it.e.e)}</small></div>`;
  }).join('');
}

function veThang() {
  const first = new Date(cur.getFullYear(), cur.getMonth(), 1);
  const start = monday(first);
  $('tieude').textContent = `Tháng ${cur.getMonth() + 1}, ${cur.getFullYear()}`;
  const today = new Date();
  let h = '<div class="thang-h">' + ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'].map((t) => `<div>${t}</div>`).join('') + '</div><div class="thang">';
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i);
    const evs = evTrongNgay(d).sort((a, b) => a.s - b.s);
    const max = innerWidth < 760 ? 2 : 3;
    h += `<div class="o ${d.getMonth() !== cur.getMonth() ? 'khac' : ''} ${sameDay(d, today) ? 'nay' : ''}" data-ngay="${ymd(d)}"><div class="d"><span>${d.getDate()}</span></div>` +
      evs.slice(0, max).map((e) => `<div class="ev-ngay" data-id="${e.key}" style="background:${esc(cat(e.loai).mau)}">${e.ca_ngay ? '' : hm(e.s) + ' '}${dauLap(e)}${esc(e.tieu_de)}</div>`).join('') +
      (evs.length > max ? `<div class="them">+${evs.length - max} nữa</div>` : '') + '</div>';
  }
  h += '</div>';
  const el = $('lich'); el.className = 'cal-wrap'; el.style.display = 'flex'; el.innerHTML = h;
  el.querySelectorAll('.o').forEach((o) => o.onclick = (ev) => {
    const n = ev.target.closest('[data-id]');
    if (n) return moHopThoai(EV.find((x) => x.key === n.dataset.id));
    moHopThoai(null, { ngay: o.dataset.ngay, gio: '09:00' });
  });
}

/* ---------- Điều hướng ---------- */
function dich(n) {
  if (view === 'month') cur = new Date(cur.getFullYear(), cur.getMonth() + n, 1);
  else cur = addDays(cur, n * (view === 'day' ? 1 : 7));
  veLich();
}
$('btnTruoc').onclick = () => dich(-1);
$('btnSau').onclick = () => dich(1);
$('btnNay').onclick = () => { cur = new Date(); veLich(); };
$('chonKieu').onchange = (e) => { view = e.target.value; localStorage.setItem('kieu', view); veLich.lanDau = false; veLich(); };
function hienTrang(p) {
  document.querySelectorAll('.page').forEach((x) => x.classList.toggle('on', x.id === 'p-' + p));
  document.querySelectorAll('.nav a').forEach((a) => a.classList.toggle('on', a.dataset.p === p));
  $('btnNay').parentNode.querySelectorAll('#btnNay,#btnTruoc,#btnSau,#chonKieu,#tieude').forEach((x) => x.style.visibility = p === 'lich' ? 'visible' : 'hidden');
  if (p === 'lich') veLich();
  if (p === 'rac') veRac();
}
document.querySelectorAll('.nav a').forEach((a) => a.onclick = () => hienTrang(a.dataset.p));
$('btnCai').onclick = () => hienTrang($('p-cai').classList.contains('on') ? 'lich' : 'cai');
$('btnTao').onclick = $('fab').onclick = () => moHopThoai(null, { ngay: ymd(cur), gio: pad(Math.min(new Date().getHours() + 1, 23)) + ':00' });

/* ---------- Hộp thoại sự kiện ---------- */
function dongHop() { $('ov').classList.remove('on'); }
$('ov').onclick = (e) => { if (e.target === $('ov')) dongHop(); };
function moHopThoai(ev, mac) {
  const moi = !ev;
  let s, e, canNgay = false, loai = CATS[0] ? CATS[0].id : 'cv', lap = 'none', lapDen = '';
  if (moi) { s = parseLocal(mac.ngay, mac.gio); e = new Date(s.getTime() + 3600000); }
  else { s = ev.s; e = ev.e; canNgay = ev.ca_ngay; loai = ev.loai; lap = ev.lap || 'none'; lapDen = ev.lap_den || ''; }
  $('dlg').innerHTML = `
    <h3>${moi ? 'Sự kiện mới' : 'Sửa sự kiện'}${lap !== 'none' ? ' lặp' : ''}</h3>
    <div class="f"><input class="lon" id="fTen" placeholder="Thêm tiêu đề" value="${esc(ev ? ev.tieu_de : '')}"></div>
    <div class="f"><label><input type="checkbox" id="fCaNgay" ${canNgay ? 'checked' : ''}>Cả ngày</label></div>
    <div class="hang"><div class="f"><label>Ngày bắt đầu</label><input type="date" id="fN1" value="${ymd(s)}"></div>
      <div class="f" id="g1"><label>Giờ bắt đầu</label><input type="time" id="fG1" value="${hm(s)}"></div></div>
    <div class="hang"><div class="f"><label>Ngày kết thúc</label><input type="date" id="fN2" value="${ymd(canNgay ? new Date(e.getTime() - 1) : e)}"></div>
      <div class="f" id="g2"><label>Giờ kết thúc</label><input type="time" id="fG2" value="${hm(e)}"></div></div>
    <div class="hang"><div class="f"><label>Lặp lại</label><select id="fLap">${Object.keys(LAP_TEN).map((k) => `<option value="${k}" ${k === lap ? 'selected' : ''}>${LAP_TEN[k]}</option>`).join('')}</select></div>
      <div class="f" id="gDen"><label>Lặp đến hết ngày (tuỳ chọn)</label><input type="date" id="fDen" value="${lapDen}"></div></div>
    <div class="f"><label>Loại việc</label><select id="fLoai">${CATS.map((c) => `<option value="${esc(c.id)}" ${c.id === loai ? 'selected' : ''}>${esc(c.ten)}</option>`).join('')}</select></div>
    <div class="f"><label>Ghi chú</label><textarea id="fGhi" rows="3">${esc(ev ? ev.ghi_chu : '')}</textarea></div>
    <div class="hanh-dong">${moi ? '' : '<button class="btn-chu btn-do" id="bXoa">Xoá</button>'}<div class="spacer"></div>
      <button class="btn-chu" id="bHuy">Huỷ</button><button class="btn-xanh" id="bLuu">Lưu</button></div>`;
  const doiCaNgay = () => { const v = $('fCaNgay').checked; $('g1').hidden = $('g2').hidden = v; };
  $('fCaNgay').onchange = doiCaNgay; doiCaNgay();
  const doiLap = () => { $('gDen').hidden = $('fLap').value === 'none'; };
  $('fLap').onchange = doiLap; doiLap();
  $('fN1').onchange = () => { if ($('fN2').value < $('fN1').value) $('fN2').value = $('fN1').value; };
  $('bHuy').onclick = dongHop;
  $('bLuu').onclick = () => luu(ev);
  if (!moi) $('bXoa').onclick = () => xoa(ev);
  $('ov').classList.add('on');
  if (moi) $('fTen').focus();
}
async function luu(ev) {
  const ten = $('fTen').value.trim();
  if (!ten) return toast('Nhập tiêu đề trước nhé');
  const cn = $('fCaNgay').checked;
  let s, e;
  if (cn) { s = parseLocal($('fN1').value); e = addDays(parseLocal($('fN2').value), 1); }
  else { s = parseLocal($('fN1').value, $('fG1').value); e = parseLocal($('fN2').value, $('fG2').value); }
  if (isNaN(s) || isNaN(e)) return toast('Ngày/giờ chưa đúng');
  if (e <= s) { if (cn) return toast('Ngày kết thúc phải sau ngày bắt đầu'); e = new Date(s.getTime() + 15 * 60000); }
  const row = { tieu_de: ten, ghi_chu: $('fGhi').value.trim() || null, bat_dau: s.toISOString(), ket_thuc: e.toISOString(), ca_ngay: cn, loai: $('fLoai').value, sua_luc: new Date().toISOString() };
  row.lap = $('fLap').value; row.lap_den = row.lap === 'none' ? null : ($('fDen').value || null);
  if (row.lap_den && row.lap_den < ymd(s)) return toast('Ngày kết thúc lặp phải sau ngày bắt đầu');
  let r;
  if (ev && ev.base.lap !== 'none') {
    const pham = await hoiPham('Sửa sự kiện lặp', 'Lưu'); if (!pham) return dongHop();
    r = await apDung(ev, row, pham);
  } else {
    $('bLuu').disabled = true;
    r = ev ? await sb.from('su_kien').update(row).eq('id', ev.id) : await sb.from('su_kien').insert(row);
  }
  if (r.error) return toast('Lưu lỗi: ' + r.error.message);
  dongHop(); toast(ev ? 'Đã lưu thay đổi' : 'Đã thêm sự kiện');
  await taiSuKien(); veLich();
}
async function xoa(ev) {
  let r;
  if (ev.base.lap !== 'none') {
    const pham = await hoiPham('Xoá sự kiện lặp', 'Xoá'); if (!pham) return dongHop();
    r = await xoaLap(ev, pham);
  } else {
    if (!confirm('Xoá sự kiện "' + ev.tieu_de + '"? (vào thùng rác 30 ngày)')) return;
    r = await sb.from('su_kien').update({ xoa_luc: new Date().toISOString() }).eq('id', ev.id);
  }
  if (r.error) return toast('Xoá lỗi: ' + r.error.message);
  dongHop(); toast('Đã xoá sự kiện'); await taiSuKien(); veLich();
}

/* ---------- Sự kiện lặp: hỏi 3 lựa chọn + áp dụng ---------- */
function hoiPham(tieu, nut) {
  return new Promise((ok) => {
    $('dlg').innerHTML = `<h3>${tieu}</h3><div class="chon-pham">
      <label><input type="radio" name="pham" value="one" checked>Chỉ sự kiện này</label>
      <label><input type="radio" name="pham" value="fut">Sự kiện này và các sự kiện sau</label>
      <label><input type="radio" name="pham" value="all">Tất cả sự kiện</label></div>
      <div class="hanh-dong"><div class="spacer"></div><button class="btn-chu" id="pHuy">Huỷ</button><button class="btn-xanh" id="pOk">${nut}</button></div>`;
    $('ov').classList.add('on');
    $('pHuy').onclick = () => ok(null);
    $('pOk').onclick = () => ok(document.querySelector('input[name=pham]:checked').value);
  });
}
const isoNgoai = (b, t) => [...(b.lap_ngoai || []), new Date(t).toISOString()];
async function apDung(ev, f, pham) {
  const b = ev.base, occ = ev.occ.getTime(), bs = new Date(b.bat_dau).getTime();
  if (pham === 'fut' && occ === bs) pham = 'all';
  const ns = new Date(f.bat_dau), ne = new Date(f.ket_thuc);
  if (pham === 'all') {
    const delta = ns.getTime() - occ;
    const g = { ...f, bat_dau: new Date(bs + delta).toISOString(), ket_thuc: new Date(bs + delta + (ne - ns)).toISOString() };
    if (delta) g.lap_ngoai = (b.lap_ngoai || []).map((x) => new Date(new Date(x).getTime() + delta).toISOString());
    return sb.from('su_kien').update(g).eq('id', b.id);
  }
  const moi = { tieu_de: b.tieu_de, ghi_chu: b.ghi_chu, ca_ngay: b.ca_ngay, loai: b.loai, lap: b.lap, lap_den: b.lap_den, ...f };
  let r1;
  if (pham === 'one') { moi.lap = 'none'; moi.lap_den = null; r1 = await sb.from('su_kien').update({ lap_ngoai: isoNgoai(b, occ) }).eq('id', b.id); }
  else r1 = await sb.from('su_kien').update({ lap_den: ymd(addDays(sod(ev.occ), -1)) }).eq('id', b.id);
  if (r1.error) return r1;
  return sb.from('su_kien').insert(moi);
}
async function xoaLap(ev, pham) {
  const b = ev.base, occ = ev.occ.getTime();
  if (pham === 'fut' && occ === new Date(b.bat_dau).getTime()) pham = 'all';
  if (pham === 'all') return sb.from('su_kien').update({ xoa_luc: new Date().toISOString() }).eq('id', b.id);
  if (pham === 'one') return sb.from('su_kien').update({ lap_ngoai: isoNgoai(b, occ) }).eq('id', b.id);
  return sb.from('su_kien').update({ lap_den: ymd(addDays(sod(ev.occ), -1)) }).eq('id', b.id);
}

/* ---------- Kéo thả đổi giờ/ngày (chuột: kéo luôn; cảm ứng: nhấn giữ rồi kéo) ---------- */
let vuaKeo = 0;
function keoTha(el, ev) {
  if (!ev) return;
  let g = null;
  const xy = (e) => { const t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e; return [t.clientX, t.clientY]; };
  const go = () => {
    document.removeEventListener('touchmove', di); document.removeEventListener('mousemove', di);
    document.removeEventListener('touchend', tha); document.removeEventListener('mouseup', tha); document.removeEventListener('touchcancel', huy);
  };
  const don = () => { clearTimeout(g.timer); go(); el.classList.remove('keo'); el.style.transform = ''; };
  const bat = (e, cam) => {
    if (!cam && e.button > 0) return;
    const [x, y] = xy(e);
    g = { x0: x, y0: y, on: false, cam };
    if (cam) g.timer = setTimeout(() => { g.on = true; el.classList.add('keo'); if (navigator.vibrate) navigator.vibrate(12); }, 350);
    document.addEventListener(cam ? 'touchmove' : 'mousemove', di, { passive: false });
    document.addEventListener(cam ? 'touchend' : 'mouseup', tha);
    if (cam) document.addEventListener('touchcancel', huy);
  };
  const di = (e) => {
    if (!g) return;
    const [x, y] = xy(e), dx = x - g.x0, dy = y - g.y0;
    if (!g.on) {
      if (Math.hypot(dx, dy) <= (g.cam ? 8 : 5)) return;
      if (g.cam) { clearTimeout(g.timer); go(); g = null; return; } // đang cuộn trang
      g.on = true; el.classList.add('keo');
    }
    e.preventDefault();
    el.style.transform = `translate(${dx}px,${dy}px)`;
  };
  const huy = () => { if (g) { don(); g = null; } };
  const tha = async (e) => {
    if (!g) return;
    const was = g.on, [x, y] = xy(e), dy = y - g.y0;
    don(); g = null;
    if (!was) return;
    if (e.cancelable) e.preventDefault();
    vuaKeo = Date.now();
    const cols = [...document.querySelectorAll('.cot')];
    if (!cols.length) return;
    let col = cols.find((c) => { const r = c.getBoundingClientRect(); return x >= r.left && x < r.right; });
    if (!col) col = x < cols[0].getBoundingClientRect().left ? cols[0] : cols[cols.length - 1];
    const phutCu = ev.s.getHours() * 60 + ev.s.getMinutes();
    const phutMoi = Math.max(0, Math.min(1425, Math.round((phutCu + (dy / H) * 60) / 15) * 15));
    const ns = parseLocal(col.dataset.ngay, pad(Math.floor(phutMoi / 60)) + ':' + pad(phutMoi % 60));
    const ne = new Date(ns.getTime() + (ev.e - ev.s));
    if (ns.getTime() === ev.s.getTime()) return;
    const f = { bat_dau: ns.toISOString(), ket_thuc: ne.toISOString(), sua_luc: new Date().toISOString() };
    let r;
    if (ev.base.lap !== 'none') {
      const pham = await hoiPham('Di chuyển sự kiện lặp', 'Di chuyển');
      dongHop(); if (!pham) return veLich();
      r = await apDung(ev, f, pham);
    } else r = await sb.from('su_kien').update(f).eq('id', ev.id);
    if (r.error) toast('Lỗi: ' + r.error.message); else toast('Đã chuyển sang ' + hm(ns) + ' ' + THU[ns.getDay()] + ' ' + ns.getDate() + '/' + (ns.getMonth() + 1));
    await taiSuKien(); veLich();
  };
  el.addEventListener('mousedown', (e) => bat(e, false));
  el.addEventListener('touchstart', (e) => bat(e, true), { passive: true });
}

/* ---------- Thùng rác ---------- */
async function veRac() {
  const r = await sb.from('su_kien').select('*').not('xoa_luc', 'is', null).order('xoa_luc', { ascending: false });
  if (r.error) { $('dsRac').textContent = 'Lỗi: ' + r.error.message; return; }
  if (!r.data.length) { $('dsRac').innerHTML = '<div class="muted">Thùng rác trống.</div>'; return; }
  $('dsRac').innerHTML = r.data.map((e) => {
    const con = Math.max(0, 30 - Math.floor((Date.now() - new Date(e.xoa_luc)) / 86400000));
    const s = new Date(e.bat_dau);
    return `<div class="dong-rac"><span class="dot" style="background:${esc(cat(e.loai).mau)}"></span><div class="nd"><b>${e.lap !== 'none' ? '↻ ' : ''}${esc(e.tieu_de)}</b><span class="muted">${THU[s.getDay()]} ${s.getDate()}/${s.getMonth() + 1}/${s.getFullYear()}${e.ca_ngay ? '' : ' ' + hm(s)} · còn ${con} ngày</span></div>
      <button class="btn-chu" data-kp="${e.id}">Khôi phục</button><button class="btn-chu btn-do" data-xh="${e.id}">Xoá hẳn</button></div>`;
  }).join('');
  $('dsRac').querySelectorAll('[data-kp]').forEach((b) => b.onclick = async () => {
    const x = await sb.from('su_kien').update({ xoa_luc: null }).eq('id', b.dataset.kp);
    if (x.error) return toast('Lỗi: ' + x.error.message);
    toast('Đã khôi phục'); await taiSuKien(); veRac();
  });
  $('dsRac').querySelectorAll('[data-xh]').forEach((b) => b.onclick = async () => {
    if (!confirm('Xoá hẳn? Không khôi phục lại được.')) return;
    const x = await sb.from('su_kien').delete().eq('id', b.dataset.xh);
    if (x.error) return toast('Lỗi: ' + x.error.message);
    toast('Đã xoá hẳn'); veRac();
  });
}
async function donRac() { await sb.from('su_kien').delete().lt('xoa_luc', new Date(Date.now() - 30 * 86400000).toISOString()); }
$('btnRac').onclick = () => hienTrang('rac');

/* ---------- Cài đặt loại việc ---------- */
function veCai() {
  $('sua-loai').innerHTML = CATS.map((c) => `<div class="dong-loai"><input type="color" value="${esc(c.mau)}" data-id="${esc(c.id)}" data-k="mau"><input type="text" value="${esc(c.ten)}" data-id="${esc(c.id)}" data-k="ten"></div>`).join('');
  $('sua-loai').querySelectorAll('input').forEach((i) => i.onchange = async () => {
    const v = i.dataset.k === 'ten' ? i.value.trim() : i.value;
    if (!v) return veCai();
    const r = await sb.from('loai_viec').update({ [i.dataset.k]: v }).eq('id', i.dataset.id);
    if (r.error) return toast('Lưu lỗi: ' + r.error.message);
    await taiLoai(); veLoai(); veLich(); toast('Đã lưu loại việc');
  });
}

setInterval(() => { if (user && view !== 'month' && $('p-lich').classList.contains('on') && !$('ov').classList.contains('on')) { const el = $('lich'), t = el.scrollTop; veLich(); el.scrollTop = t; } }, 60000);
capNhat();
</script>
